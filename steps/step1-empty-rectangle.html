<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Step 1 – Empty Rectangle (Vue 3)</title>
  <style>
    .rect {
      width: 200px;
      height: 120px;
      border: 2px solid #333;
    }
  </style>
</head>
<body>
  <!-- Vue renders inside this element -->
  <div id="app">
    <div class="rect"></div>
  </div>

  <script type="module">
    import { createApp } from 'https://unpkg.com/vue@3/dist/vue.esm-browser.prod.js'

    createApp({}).mount('#app')
  </script>
</body>
</html>
