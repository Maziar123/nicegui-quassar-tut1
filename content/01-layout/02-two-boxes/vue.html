<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>1.2 Two boxes side by side (Vue 3)</title>
  <style>
    body { margin: 0; }
    .page { padding: 16px; }
    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
    }
    .box {
      width: 200px;
      height: 120px;
      border: 2px solid #333;
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="page">
      <div class="row">
        <div class="box"></div>  <!-- left -->
        <div class="box"></div>  <!-- right -->
      </div>
    </div>
  </div>

  <script type="module">
    import { createApp } from 'https://cdn.jsdelivr.net/npm/vue@3/dist/vue.esm-browser.prod.js'

    createApp({}).mount('#app')
  </script>
</body>
</html>
