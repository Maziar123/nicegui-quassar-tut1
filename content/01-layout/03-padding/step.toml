# Step 1.3. Read by tutorial/build.py. Text fields are Markdown (inline). See AGENTS.md for the cross-comment rules.

name = "Space inside a box"

intro = [
  "Give each box 16 px of space on the inside, and put a small dark square in it so you can see that space.",
  "Space between a border and the content is called **padding**. Quasar has ready-made classes for it, and `q-pa-md` is 16 px.",
  "Look at cross-comment 1: NiceGUI uses the very same Quasar class. Every NiceGUI element is a Quasar element, so every Quasar class works in NiceGUI.",
]
picture_caption = "Padding: 16 px between the border and the square"
try_it = "Change `q-pa-md` to `q-pa-xl` in Quasar and NiceGUI, and `padding: 16px` to `48px` in Vue. The squares move in by the same amount."

[columns.quasar]
note = "`class=\"q-pa-md\"` gives the padding: **p** for padding, **a** for all sides, **md** for medium (16 px)."
open = "quasar.html"

[columns.nicegui]
note = "`.classes('q-pa-md')` adds the same Quasar class. The square goes inside the box with a second `with`."
run = "python nicegui_app.py"

[columns.vue]
note = "Plain CSS: `padding: 16px` in the `.box` rule, and a `.dot` rule for the square."
open = "vue.html"

[[cross]]
idea = "Padding"
say = "16 px of space between a box's border and what is inside it."
quasar = { at = [["<!-- left -->"], ["<!-- right -->"]], hint = 'class="q-pa-md"' }
nicegui = { at = [["# left"], ["# right"]], hint = ".classes('q-pa-md')" }
vue = { at = [["==      padding: 16px;"]], hint = "padding: 16px" }

[[cross]]
idea = "Content"
say = "The square is a child of the box, so the padding pushes it in from the border."
quasar = { at = [["<!-- left -->", "=</div>"]], hint = "a div inside the box" }
nicegui = { at = [["# left", "ui.element('div').style(DOT)"]], hint = "indented under with" }
vue = { at = [["<!-- left -->", "=</div>"]], hint = '<div class="dot">' }

[[cross]]
idea = "Filled square"
say = "A box with a `background` colour and no border: 40 × 40 px."
quasar = { at = [["width: 40px"]], hint = 'style="… background: #333"' }
nicegui = { at = [["DOT = "]], hint = "DOT = '…'" }
vue = { at = [[".dot {", "=}"]], hint = ".dot { … }" }

[[cross]]
idea = "Page padding"
say = "The page itself has the same 16 px padding, so its content does not touch the window edge (step 1.1)."
quasar = { at = [['<q-page class="q-pa-md">']], hint = 'class="q-pa-md"' }
nicegui = { builtin = "NiceGUI's content area has padding: 1rem (16 px)." }
vue = { at = [[".page { padding: 16px; }"]], hint = ".page { padding: 16px }" }
