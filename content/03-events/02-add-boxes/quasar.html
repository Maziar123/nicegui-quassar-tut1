<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3.2 Add a box on each click (Quasar)</title>
  <link href="https://cdn.jsdelivr.net/npm/quasar@2/dist/quasar.prod.css" rel="stylesheet">
</head>
<body>
  <div id="q-app">
    <q-layout view="hhh lpr fff">
      <q-page-container>
        <q-page class="q-pa-md">
          <div class="row" style="gap: 16px">
            <div v-for="n in count" :key="n" :style="box" @click="count++"></div>
          </div>
        </q-page>
      </q-page-container>
    </q-layout>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/quasar@2/dist/quasar.umd.prod.js"></script>
  <script>
    const { createApp, ref } = Vue
    const app = createApp({
      setup() {
        const count = ref(1)
        const box = { width: '200px', height: '120px', border: '2px solid #333', cursor: 'pointer' }
        return { count, box }
      },
    })
    app.use(Quasar)
    app.mount('#q-app')
  </script>
</body>
</html>
