<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" role="img" aria-label="A row with one box, then after a click a row with two boxes, then three.">
  <g fill="none" stroke="currentColor" stroke-width="2">
    <rect x="20" y="24" width="70" height="42"/>
    <rect x="20" y="84" width="70" height="42"/>
    <rect x="100" y="84" width="70" height="42"/>
    <rect x="20" y="144" width="70" height="42"/>
    <rect x="100" y="144" width="70" height="42"/>
    <rect x="180" y="144" width="70" height="42"/>
  </g>
  <g font-size="13" fill="currentColor">
    <text x="270" y="50">start: 1 box</text>
    <text x="270" y="110">1 click: 2 boxes</text>
    <text x="270" y="170">2 clicks: 3 boxes</text>
  </g>
</svg>
