<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3.1 Click a box (Vue 3)</title>
  <style>
    body { margin: 0; }
    .page { padding: 16px; }
    .box {
      width: 200px;
      height: 120px;
      border: 2px solid #333;
      box-sizing: border-box;
      cursor: pointer;
    }
    .filled { background: #333; }
  </style>
</head>
<body>
  <div id="app">
    <div class="page">
      <div class="box" :class="{ filled }" @click="filled = !filled"></div>
    </div>
  </div>

  <script type="module">
    import { createApp, ref } from 'https://cdn.jsdelivr.net/npm/vue@3/dist/vue.esm-browser.prod.js'

    createApp({ setup: () => ({ filled: ref(false) }) }).mount('#app')
  </script>
</body>
</html>
