<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 190" role="img" aria-label="Two boxes: an empty one, and after a click the same box filled dark. A second click empties it again.">
  <rect x="20" y="40" width="140" height="84" fill="none" stroke="currentColor" stroke-width="2.4"/>
  <rect x="240" y="40" width="140" height="84" fill="currentColor" stroke="currentColor" stroke-width="2.4"/>
  <path d="M170 70 H230 M224 64 L231 70 L224 76" fill="none" stroke="currentColor" stroke-width="1.8"/>
  <text x="200" y="58" font-size="13" font-weight="600" fill="currentColor" text-anchor="middle">click</text>
  <path d="M230 100 H170 M176 94 L169 100 L176 106" fill="none" stroke="currentColor" stroke-width="1.8" stroke-opacity=".6"/>
  <text x="200" y="120" font-size="12" fill="currentColor" fill-opacity=".75" text-anchor="middle">click again</text>
  <text x="90" y="150" font-size="12" fill="currentColor" text-anchor="middle">filled = false</text>
  <text x="310" y="150" font-size="12" fill="currentColor" text-anchor="middle">filled = true</text>
</svg>
