<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 230" role="img" aria-label="A tree of nodes: page, then row, then a left box and a right box. Arrows show that the render function turns the tree into the page.">
  <g font-size="13" fill="currentColor" text-anchor="middle">
    <rect x="140" y="12" width="120" height="30" rx="6" fill="none" stroke="currentColor" stroke-width="1.6"/>
    <text x="200" y="32">page</text>
    <rect x="140" y="78" width="120" height="30" rx="6" fill="none" stroke="currentColor" stroke-width="1.6"/>
    <text x="200" y="98">row</text>
    <rect x="50" y="144" width="120" height="30" rx="6" fill="none" stroke="currentColor" stroke-width="2.4"/>
    <text x="110" y="164">box (left)</text>
    <rect x="230" y="144" width="120" height="30" rx="6" fill="none" stroke="currentColor" stroke-width="2.4"/>
    <text x="290" y="164">box (right)</text>
  </g>
  <path d="M200 42 V78 M200 108 V126 H110 V144 M200 126 H290 V144" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="200" y="210" font-size="13" font-weight="600" fill="currentColor" text-anchor="middle">tree → render(h) → page</text>
</svg>
