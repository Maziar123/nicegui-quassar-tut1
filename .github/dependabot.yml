# Monthly pull requests for new versions of the GitHub Actions and of the packages in uv.lock.
# After merging a uv update, run `just reqs` so requirements.txt follows (CI checks it).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
