# Lint, tests (with headless Chromium) and "docs/ is up to date", on every push and pull request.
# Runs `just ci`, the same command you run locally.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: Install the locked environment
        run: uv sync --locked
      - name: Chromium for the browser tests
        run: uv run playwright install --with-deps chromium
      - name: Mermaid from npm, so the browser tests also draw diagrams (version pinned in content/site.toml)
        run: |
          v=$(uv run python -c "import tomllib; u = tomllib.load(open('content/site.toml', 'rb'))['libs']['mermaid']; print(u.split('mermaid@')[1].split('/')[0])")
          mkdir -p "$RUNNER_TEMP/npm/mermaid"
          npm pack "mermaid@$v" --pack-destination "$RUNNER_TEMP"
          tar -xzf "$RUNNER_TEMP/mermaid-$v.tgz" -C "$RUNNER_TEMP/npm/mermaid" --strip-components=1
          echo "XREF_NPM_DIR=$RUNNER_TEMP/npm" >> "$GITHUB_ENV"
      - name: just ci (lint, requirements, tests, browser tests, docs up to date)
        run: uv run just ci
